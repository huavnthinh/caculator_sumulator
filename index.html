<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Máy tính khoa học Hiện đại</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f5f0;          /* Màu nền trắng gạo ấm */
      --surface: #fafafa;     /* Bề mặt chính */
      --surface2: #f0f1eb;    /* Bề mặt phím số */
      --surface3: #e4e6dc;    /* Phím chức năng */
      --border: #e0e2d5;
      --text: #2a2d34;        /* Chữ chính tối */
      --text2: #6c727a;
      --text3: #9da3ab;
      --blue: #2f69d2;        /* Xanh nhấn công nghệ */
      --blue-dim: #eef4fe;
      --red: #dc3545;
      --red-dim: #fde8e8;
      --purple: #6f42c1;
      --purple-dim: #f3f0fa;
      --radius: 14px;
      --radius-sm: 8px;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(40, 43, 36, 0.08), 0 0 0 1px var(--border);
    }

    /* ── SCREEN ── */
    .screen {
      padding: 24px;
      background: #fbfbfa;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .screen-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .angle-btn {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text2);
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all .2s;
    }
    .angle-btn:hover { border-color: var(--blue); color: var(--blue); }
    .angle-btn.rad { border-color: var(--blue); color: #fff; background: var(--blue); }

    .expr-display {
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      color: var(--text2);
      text-align: right;
      min-height: 20px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      word-break: break-all;
    }

    .main-display {
      font-family: 'DM Mono', monospace;
      font-size: 2.2rem;
      font-weight: 500;
      color: var(--text);
      text-align: right;
      letter-spacing: -0.02em;
      line-height: 1.2;
      word-break: break-all;
      min-height: 48px;
    }
    .main-display.error { color: var(--red); }

    /* ── TABS ── */
    .tabs {
      display: flex;
      background: var(--surface2);
      padding: 4px;
      margin: 12px 16px 4px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    .tab {
      flex: 1;
      padding: 8px 4px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      background: transparent;
      border: none;
      color: var(--text2);
      border-radius: 6px;
      transition: all .15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { background: var(--surface); color: var(--blue); box-shadow: 0 2px 6px rgba(0,0,0,0.04); }

        /* ── KEYPAD ── */
        .keys-wrap { padding: 16px; }
        /* Tìm đoạn này trong CSS của bạn */
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }

    /* THÊM VÀO ĐOẠN NÀY */
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }

    .key {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      min-height: 52px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: var(--surface2);
      color: var(--text);
      transition: all .1s;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .key:hover { background: #e8eae0; border-color: #d2d4c9; }
    .key:active { transform: scale(0.96); }

    .key.num {
      background: var(--surface);
    }
    .key.num:hover { background: #f3f3f0; }

    .key.span2 { grid-column: span 2; }

    .key.op {
      background: var(--surface3);
      color: var(--text);
      font-size: 18px;
    }
    .key.op:hover { background: #dadcd2; }

    .key.fn {
      font-size: 13px;
      background: var(--blue-dim);
      border-color: rgba(47, 105, 210, 0.15);
      color: var(--blue);
    }
    .key.fn:hover { background: rgba(47, 105, 210, 0.12); }

    .key.clear {
      background: var(--red-dim);
      border-color: rgba(220, 53, 69, 0.15);
      color: var(--red);
    }
    .key.clear:hover { background: rgba(220, 53, 69, 0.12); }

    .key.eq {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
      font-size: 22px;
    }
    .key.eq:hover { background: #2556b3; }

    .key.const-key {
      flex-direction: column;
      background: var(--purple-dim);
      border-color: rgba(111, 66, 193, 0.12);
    }
    .key.const-key:hover { background: rgba(111, 66, 193, 0.08); }
    .key.const-key .sym { font-size: 15px; font-weight: 600; color: var(--purple); }
    .key.const-key .lbl { font-size: 9px; color: var(--text2); font-weight: 500; margin-top: 1px; }

    .gap-top { margin-top: 10px; }

    @media (max-width: 480px) {
      body { padding: 0.5rem; }
      .app { border-radius: 16px; }
      .key { min-height: 48px; font-size: 14px; }
    }
  </style>
</head>
<body>

  <div class="app">
    <div class="screen">
      <div class="screen-top">
        <button class="angle-btn" id="angleBtn" onclick="toggleAngle()">DEG</button>
        <div class="expr-display" id="exprLine"></div>
      </div>
      <div class="main-display" id="display">0</div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="setMode('basic')">Cơ bản</button>
      <button class="tab" onclick="setMode('sci')">Khoa học</button>
      <button class="tab" onclick="setMode('const')">Hằng số</button>
    </div>

    <div class="keys-wrap" id="keysArea"></div>
  </div>

<script>
let curInput = '0'; 
let angleMode = 'deg';
let curMode = 'basic';
let isEvaluated = false;

const $display = document.getElementById('display');
const $expr = document.getElementById('exprLine');

// Bản đồ ánh xạ hiển thị trực quan sang cú pháp JavaScript Math toán học
const tokenMap = {
  '×': '*', '÷': '/', 'π': 'Math.PI', 'e': 'Math.E', 'φ': '1.61803398874989',
  '√2': 'Math.SQRT2', '√3': 'Math.sqrt(3)', '√5': 'Math.sqrt(5)', 'ln2': 'Math.LN2',
  'ln10': 'Math.LN10', 'g': '9.80665', 'c': '299792458', 'γ': '0.57721566490153', '1/e': '(1/Math.E)'
};

function updateDisplay() {
  $display.textContent = curInput;
}

function inp(v) {
  if (curInput === '0' && v !== '.' && !isOperator(v)) {
    curInput = v;
  } else if (isEvaluated && !isOperator(v)) {
    curInput = v;
  } else {
    curInput += v;
  }
  isEvaluated = false;
  updateDisplay();
}

function isOperator(c) {
  return ['+', '-', '×', '÷'].includes(c);
}

function inpFn(fnSymbol) {
  if (curInput === '0' || isEvaluated) {
    curInput = fnSymbol;
  } else {
    const lastChar = curInput.slice(-1);
    if (isOperator(lastChar) || lastChar === '(') {
      curInput += fnSymbol;
    } else {
      curInput += '×' + fnSymbol;
    }
  }
  isEvaluated = false;
  updateDisplay();
}

function clearAll() {
  curInput = '0';
  $expr.textContent = '';
  isEvaluated = false;
  updateDisplay();
}

function backspace() {
  if (isEvaluated) {
    clearAll();
    return;
  }
  
  // Xóa nguyên cụm tên hàm nếu nhấn Backspace
  const fns = ['sin(', 'cos(', 'tan(', 'asin(', 'acos(', 'atan(', 'log(', 'ln(', 'sqrt(', 'cbrt(', 'abs(', 'floor(', 'ceil(', 'round('];
  for (let f of fns) {
    if (curInput.endsWith(f)) {
      curInput = curInput.slice(0, -f.length) || '0';
      updateDisplay();
      return;
    }
  }

  if (curInput.length <= 1) curInput = '0';
  else curInput = curInput.slice(0, -1);
  updateDisplay();
}

function negate() {
  if (curInput !== '0' && !isEvaluated) {
    if (curInput.startsWith('-')) curInput = curInput.slice(1);
    else curInput = '-' + curInput;
    updateDisplay();
  }
}

function toggleAngle() {
  angleMode = angleMode === 'deg' ? 'rad' : 'deg';
  const b = document.getElementById('angleBtn');
  b.textContent = angleMode.toUpperCase();
  b.classList.toggle('rad', angleMode === 'rad');
}

function parseToMathJS(str) {
  let res = str;
  // Thay thế các hằng số và toán tử cơ bản
  for (let [k, v] of Object.entries(tokenMap)) {
    res = res.replaceAll(k, v);
  }

  // Xử lý Giai thừa (X!) tạm thời bằng regex đơn giản gọn nhẹ cho n nguyên
  res = res.replace(/(\d+)!/g, function(match, num) {
    let r = 1;
    for (let i = 2; i <= parseInt(num); i++) r *= i;
    return r;
  });

  // Thay thế các hàm lượng giác cần tính theo DEG/RAD
  const factor = angleMode === 'deg' ? `* (Math.PI / 180)` : '';
  const invFactor = angleMode === 'deg' ? `* (180 / Math.PI)` : '';

  res = res.replaceAll(/sin\(([^)]+)\)/g, `Math.sin(($1)${factor})`);
  res = res.replaceAll(/cos\(([^)]+)\)/g, `Math.cos(($1)${factor})`);
  res = res.replaceAll(/tan\(([^)]+)\)/g, `Math.tan(($1)${factor})`);
  
  res = res.replaceAll(/asin\(([^)]+)\)/g, `(Math.asin($1)${invFactor})`);
  res = res.replaceAll(/acos\(([^)]+)\)/g, `(Math.acos($1)${invFactor})`);
  res = res.replaceAll(/atan\(([^)]+)\)/g, `(Math.atan($1)${invFactor})`);

  // Các hàm toán học cơ bản khác
  res = res.replaceAll('log(', 'Math.log10(');
  res = res.replaceAll('ln(', 'Math.log(');
  res = res.replaceAll('sqrt(', 'Math.sqrt(');
  res = res.replaceAll('cbrt(', 'Math.cbrt(');
  res = res.replaceAll('abs(', 'Math.abs(');
  res = res.replaceAll('floor(', 'Math.floor(');
  res = res.replaceAll('ceil(', 'Math.ceil(');
  res = res.replaceAll('round(', 'Math.round(');

  return res;
}

function calculate() {
  try {
    let textToEval = curInput;
    
    // Tự động đóng các dấu ngoặc còn thiếu
    let openBrackets = (textToEval.match(/\(/g) || []).length;
    let closeBrackets = (textToEval.match(/\)/g) || []).length;
    while (openBrackets > closeBrackets) {
      textToEval += ')';
      closeBrackets++;
    }

    let jsFormula = parseToMathJS(textToEval);
    let result = eval(jsFormula);

    if (typeof result === 'number') {
      if (!isFinite(result)) throw new Error();
      // Format kết quả hiển thị tinh gọn số thập phân
      result = parseFloat(result.toPrecision(12)).toString();
    }

    $expr.textContent = textToEval + ' =';
    curInput = String(result);
    isEvaluated = true;
    updateDisplay();
  } catch (e) {
    $display.textContent = 'Lỗi cú pháp';
    isEvaluated = true;
    curInput = '0';
  }
}

/* ── LAYOUT PHÍM BẤM MÁY TÍNH BỎ TÚI ── */
function btn(label, cls, action) {
  return `<button class="key ${cls}" onclick="${action}">${label}</button>`;
}

function renderKeys() {
  const el = document.getElementById('keysArea');
  if (curMode === 'basic') {
    el.innerHTML = `<div class="grid-4">
      ${btn('AC', 'clear', 'clearAll()')}
      ${btn('⌫', '', 'backspace()')}
      ${btn('+/−', '', 'negate()')}
      ${btn('÷', 'op', "inp('÷')")}
      
      ${btn('7', 'num', "inp('7')")}${btn('8', 'num', "inp('8')")}${btn('9', 'num', "inp('9')")}
      ${btn('×', 'op', "inp('×')")}
      
      ${btn('4', 'num', "inp('4')")}${btn('5', 'num', "inp('5')")}${btn('6', 'num', "inp('6')")}
      ${btn('−', 'op', "inp('-')")}
      
      ${btn('1', 'num', "inp('1')")}${btn('2', 'num', "inp('2')")}${btn('3', 'num', "inp('3')")}
      ${btn('+', 'op', "inp('+')")}
      
      ${btn('0', 'num span2', "inp('0')")}
      ${btn('.', 'num', "inp('.')")}
      ${btn('=', 'eq', 'calculate()')}
    </div>`;
  } else if (curMode === 'sci') {
    el.innerHTML = `<div class="grid-5">
      ${btn('sin', 'fn', "inpFn('sin(')")}
      ${btn('cos', 'fn', "inpFn('cos(')")}
      ${btn('tan', 'fn', "inpFn('tan(')")}
      ${btn('(', 'op', "inp('(')")}
      ${btn(')', 'op', "inp(')')")}

      ${btn('sin⁻¹', 'fn', "inpFn('asin(')")}
      ${btn('cos⁻¹', 'fn', "inpFn('acos(')")}
      ${btn('tan⁻¹', 'fn', "inpFn('atan(')")}
      ${btn('ln', 'fn', "inpFn('ln(')")}
      ${btn('log', 'fn', "inpFn('log(')")}

      ${btn('√x', 'fn', "inpFn('sqrt(')")}
      ${btn('∛x', 'fn', "inpFn('cbrt(')")}
      ${btn('x²', 'fn', "inp('**2')")}
      ${btn('x³', 'fn', "inp('**3')")}
      ${btn('n!', 'fn', "inp('!')")}

      ${btn('⌊x⌋', 'fn', "inpFn('floor(')")}
      ${btn('⌈x⌉', 'fn', "inpFn('ceil(')")}
      ${btn('|x|', 'fn', "inpFn('abs(')")}
      ${btn('1/x', 'fn', "inpFn('1/(')")}
      ${btn('%', 'fn', "inp('/100')")}
    </div>
    <div class="grid-4 gap-top">
      ${btn('AC', 'clear', 'clearAll()')}
      ${btn('⌫', '', 'backspace()')}
      ${btn('+/−', '', 'negate()')}
      ${btn('÷', 'op', "inp('÷')")}
      
      ${btn('7', 'num', "inp('7')")}${btn('8', 'num', "inp('8')")}${btn('9', 'num', "inp('9')")}
      ${btn('×', 'op', "inp('×')")}
      
      ${btn('4', 'num', "inp('4')")}${btn('5', 'num', "inp('5')")}${btn('6', 'num', "inp('6')")}
      ${btn('−', 'op', "inp('-')")}
      
      ${btn('1', 'num', "inp('1')")}${btn('2', 'num', "inp('2')")}${btn('3', 'num', "inp('3')")}
      ${btn('+', 'op', "inp('+')")}
      
      ${btn('0', 'num span2', "inp('0')")}
      ${btn('.', 'num', "inp('.')")}
      ${btn('=', 'eq', 'calculate()')}
    </div>`;
  } else {
    const consts = [
      {sym:'π', lbl:'Pi'}, {sym:'e', lbl:'Euler'}, {sym:'φ', lbl:'Tỉ lệ vàng'},
      {sym:'√2', lbl:'Căn 2'}, {sym:'√3', lbl:'Căn 3'}, {sym:'√5', lbl:'Căn 5'},
      {sym:'g', lbl:'Gia tốc g'}, {sym:'c', lbl:'Vận tốc c'}, {sym:'1/e', lbl:'1/e'}
    ];
    el.innerHTML = `<div class="grid-3">
      ${consts.map(c => `<button class="key const-key" onclick="inp('${c.sym}')">
        <span class="sym">${c.sym}</span>
        <span class="lbl">${c.lbl}</span>
      </button>`).join('')}
    </div>
    <div class="grid-4 gap-top">
      ${btn('AC', 'clear', 'clearAll()')}
      ${btn('⌫', '', 'backspace()')}
      ${btn('+/−', '', 'negate()')}
      ${btn('÷', 'op', "inp('÷')")}
      
      ${btn('7', 'num', "inp('7')")}${btn('8', 'num', "inp('8')")}${btn('9', 'num', "inp('9')")}
      ${btn('×', 'op', "inp('×')")}
      
      ${btn('4', 'num', "inp('4')")}${btn('5', 'num', "inp('5')")}${btn('6', 'num', "inp('6')")}
      ${btn('−', 'op', "inp('-')")}
      
      ${btn('1', 'num', "inp('1')")}${btn('2', 'num', "inp('2')")}${btn('3', 'num', "inp('3')")}
      ${btn('+', 'op', "inp('+')")}
      
      ${btn('0', 'num span2', "inp('0')")}
      ${btn('.', 'num', "inp('.')")}
      ${btn('=', 'eq', 'calculate()')}
    </div>`;
  }
}

function setMode(m) {
  curMode = m;
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', ['basic', 'sci', 'const'][i] === m));
  renderKeys();
}

// Bắt sự kiện bàn phím máy tính PC
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (/\d/.test(e.key)) inp(e.key);
  else if (e.key === '.') inp('.');
  else if (e.key === 'Enter' || e.key === '=') calculate();
  else if (e.key === 'Backspace') backspace();
  else if (e.key === 'Escape') clearAll();
  else if (e.key === '+') inp('+');
  else if (e.key === '-') inp('-');
  else if (e.key === '*') inp('×');
  else if (e.key === '/') inp('÷');
});

renderKeys();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1c1e;
  --screen:#0f1012;
  --s1:#242628;
  --s2:#2e3032;
  --s3:#3a3c3e;
  --border:#3d4045;
  --text:#e8eaed;
  --muted:#8a9199;
  --dim:#5a6068;
  --blue:#4da6ff;
  --blue-bg:rgba(77,166,255,0.12);
  --red:#ff6b6b;
  --red-bg:rgba(255,107,107,0.12);
  --green:#5ccf8a;
  --r:12px;--rs:8px;
}
body{font-family:'Outfit',sans-serif;background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
.calc{width:100%;max-width:420px;background:var(--s1);border-radius:20px;border:1px solid var(--border);overflow:hidden;box-shadow:0 32px 64px rgba(0,0,0,0.5)}
.screen{padding:20px 20px 14px;background:var(--screen);border-bottom:1px solid var(--border);min-height:120px;display:flex;flex-direction:column;gap:4px;position:relative}
.screen-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mode-badge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.08em;padding:3px 10px;border-radius:20px;cursor:pointer;transition:all .2s;background:var(--s2);color:var(--muted);border:1px solid var(--border)}
.mode-badge.rad{background:var(--blue-bg);color:var(--blue);border-color:rgba(77,166,255,0.25)}
.history-line{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim);text-align:right;min-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main-line{font-family:'JetBrains Mono',monospace;font-size:2rem;font-weight:500;color:var(--text);text-align:right;word-break:break-all;line-height:1.25;min-height:50px;display:flex;align-items:flex-end;justify-content:flex-end}
.main-line.error{color:var(--red);font-size:1.1rem;font-weight:400}
.cursor{display:inline-block;width:2px;height:1.1em;background:var(--blue);margin-left:2px;border-radius:1px;vertical-align:text-bottom;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tabs{display:flex;padding:8px 12px 0;background:var(--s1);gap:4px}
.tab{flex:1;padding:8px 4px;font-size:12px;font-weight:600;text-align:center;cursor:pointer;background:transparent;border:none;color:var(--muted);border-bottom:2px solid transparent;transition:all .15s;font-family:'Outfit',sans-serif}
.tab:hover{color:var(--text)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.keys{padding:14px}
.row{display:flex;gap:8px;margin-bottom:8px}
.row:last-child{margin-bottom:0}
.k{flex:1;border:1px solid var(--border);border-radius:var(--rs);min-height:48px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer;background:var(--s2);color:var(--text);transition:background .1s,transform .08s;display:flex;align-items:center;justify-content:center;user-select:none;gap:3px;position:relative;white-space:nowrap}
.k:hover{background:var(--s3)}
.k:active{transform:scale(0.94);background:#404448}
.k.w2{flex:2}
.k.num{background:#20232b;border-color:#30333d}
.k.num:hover{background:#262933}
.k.op{background:var(--s3);font-size:18px}
.k.op:hover{background:#464a4f}
.k.fn{background:var(--blue-bg);border-color:rgba(77,166,255,0.2);color:var(--blue);font-size:12px;font-weight:600}
.k.fn:hover{background:rgba(77,166,255,0.18)}
.k.clear{background:var(--red-bg);border-color:rgba(255,107,107,0.2);color:var(--red)}
.k.clear:hover{background:rgba(255,107,107,0.18)}
.k.eq{background:var(--blue);border-color:var(--blue);color:#fff;font-size:20px;font-weight:700}
.k.eq:hover{background:#3a90e0}
.k.const{flex-direction:column;background:rgba(92,207,138,0.08);border-color:rgba(92,207,138,0.15);color:var(--green)}
.k.const:hover{background:rgba(92,207,138,0.13)}
.k.const .sym{font-size:15px;font-weight:700}
.k.const .lbl{font-size:9px;font-weight:500;color:var(--muted);margin-top:1px}
sup{font-size:0.65em;vertical-align:super}
</style>
</head>
<body>
<div class="calc">
  <div class="screen">
    <div class="screen-meta">
      <button class="mode-badge" id="modeBtn" onclick="toggleAngle()">DEG</button>
      <div class="history-line" id="histLine"></div>
    </div>
    <div class="main-line" id="mainDisp">
      <span id="dispText">0</span><span class="cursor"></span>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="setTab('basic',this)">Cơ bản</button>
    <button class="tab" onclick="setTab('sci',this)">Khoa học</button>
    <button class="tab" onclick="setTab('const',this)">Hằng số</button>
  </div>
  <div class="keys" id="keysArea"></div>
</div>

<script>
// ── STATE ──
let expr = '';
let mathExpr = '';
let isResult = false;
let angleDeg = true;
let curTab = 'basic';
let tokens = [];

const $disp = document.getElementById('dispText');
const $hist = document.getElementById('histLine');
const $main = document.getElementById('mainDisp');

function renderDisplay() {
  $main.classList.remove('error');
  $disp.textContent = expr || '0';
}

// ── INPUT SYSTEM (token đôi: display vs math) ──
function addToken(display, math) {
  if (isResult) {
    if (['+','−','×','÷','^'].includes(display)) {
      // tiếp tục từ kết quả
    } else {
      tokens = []; expr = ''; mathExpr = '';
    }
    isResult = false;
  }
  tokens.push({ display, math });
  expr += display;
  mathExpr += math;
  renderDisplay();
}

function addNum(n)          { addToken(n, n); }
function addOp(disp, math)  { addToken(disp, math); }
function addFn(name, jsName){ addToken(name, jsName); }

function addConst(disp, mathVal) {
  if (isResult) { tokens=[]; expr=''; mathExpr=''; isResult=false; }
  addToken(disp, mathVal);
}

function backspace() {
  if (isResult) { clearAll(); return; }
  if (tokens.length === 0) return;
  const last = tokens.pop();
  expr = expr.slice(0, -last.display.length);
  mathExpr = mathExpr.slice(0, -last.math.length);
  renderDisplay();
}

function clearAll() {
  tokens=[]; expr=''; mathExpr='';
  isResult=false;
  $hist.textContent='';
  $main.classList.remove('error');
  $disp.textContent='0';
}

function negate() {
  if (tokens.length === 0) return;
  const d = '-('+expr+')';
  const m = '-('+mathExpr+')';
  tokens = [{display:d, math:m}];
  expr=d; mathExpr=m;
  renderDisplay();
}

function toggleAngle() {
  angleDeg = !angleDeg;
  const b = document.getElementById('modeBtn');
  b.textContent = angleDeg ? 'DEG' : 'RAD';
  b.classList.toggle('rad', !angleDeg);
}

// ── EVALUATE ──
function calculate() {
  if (!expr) return;
  try {
    let js = mathExpr;

    // Tự động đóng ngoặc còn thiếu
    const opens  = (js.match(/\(/g)||[]).length;
    const closes = (js.match(/\)/g)||[]).length;
    js += ')'.repeat(Math.max(0, opens - closes));

    // Áp dụng chế độ góc khi tính
    if (angleDeg) {
      js = js.replace(/__SIN__\(/g,  'Math.sin(Math.PI/180*');
      js = js.replace(/__COS__\(/g,  'Math.cos(Math.PI/180*');
      js = js.replace(/__TAN__\(/g,  'Math.tan(Math.PI/180*');
      js = js.replace(/__ASIN__\(/g, '(180/Math.PI)*Math.asin(');
      js = js.replace(/__ACOS__\(/g, '(180/Math.PI)*Math.acos(');
      js = js.replace(/__ATAN__\(/g, '(180/Math.PI)*Math.atan(');
    } else {
      js = js.replace(/__SIN__\(/g,  'Math.sin(');
      js = js.replace(/__COS__\(/g,  'Math.cos(');
      js = js.replace(/__TAN__\(/g,  'Math.tan(');
      js = js.replace(/__ASIN__\(/g, 'Math.asin(');
      js = js.replace(/__ACOS__\(/g, 'Math.acos(');
      js = js.replace(/__ATAN__\(/g, 'Math.atan(');
    }

    let result = eval(js);
    if (!isFinite(result) || isNaN(result)) throw new Error('undefined');

    // Định dạng kết quả
    let displayResult;
    const abs = Math.abs(result);
    if (abs !== 0 && (abs >= 1e15 || abs < 1e-10)) {
      displayResult = result.toExponential(6).replace(/\.?0+e/, 'e');
    } else {
      displayResult = parseFloat(result.toPrecision(12)).toString();
    }

    $hist.textContent = expr + ' =';
    tokens = [{ display: displayResult, math: displayResult }];
    expr = displayResult; mathExpr = displayResult;
    isResult = true;
    renderDisplay();
  } catch(e) {
    $main.classList.add('error');
    $disp.textContent = 'Lỗi';
    isResult = true;
    tokens=[]; expr=''; mathExpr='';
  }
}

// ── RENDER PHÍM BẤM ──
function h(label, cls, fn) {
  return `<button class="k ${cls}" onclick="${fn}">${label}</button>`;
}

function renderKeys() {
  const el = document.getElementById('keysArea');

  const numpad = `
    <div class="row">
      ${h('AC','clear','clearAll()')}
      ${h('⌫','','backspace()')}
      ${h('+/−','','negate()')}
      ${h('÷','op',"addOp('÷','/')")}
    </div>
    <div class="row">
      ${h('7','num',"addNum('7')")}${h('8','num',"addNum('8')")}${h('9','num',"addNum('9')")}
      ${h('×','op',"addOp('×','*')")}
    </div>
    <div class="row">
      ${h('4','num',"addNum('4')")}${h('5','num',"addNum('5')")}${h('6','num',"addNum('6')")}
      ${h('−','op',"addOp('−','-')")}
    </div>
    <div class="row">
      ${h('1','num',"addNum('1')")}${h('2','num',"addNum('2')")}${h('3','num',"addNum('3')")}
      ${h('+','op',"addOp('+','+')")}
    </div>
    <div class="row">
      ${h('0','num w2',"addNum('0')")}
      ${h('.','num',"addNum('.')")}
      ${h('=','eq','calculate()')}
    </div>`;

  if (curTab === 'basic') {
    el.innerHTML = numpad;
  } else if (curTab === 'sci') {
    el.innerHTML = `
    <div class="row">
      ${h('sin','fn',"addFn('sin(','__SIN__(')")}
      ${h('cos','fn',"addFn('cos(','__COS__(')")}
      ${h('tan','fn',"addFn('tan(','__TAN__(')")}
      ${h('(','op',"addOp('(','(')")}
      ${h(')','op',"addOp(')',')')")}
    </div>
    <div class="row">
      ${h('sin<sup>−1</sup>','fn',"addFn('arcsin(','__ASIN__(')")}
      ${h('cos<sup>−1</sup>','fn',"addFn('arccos(','__ACOS__(')")}
      ${h('tan<sup>−1</sup>','fn',"addFn('arctan(','__ATAN__(')")}
      ${h('ln','fn',"addFn('ln(','Math.log(')")}
      ${h('log','fn',"addFn('log(','Math.log10(')")}
    </div>
    <div class="row">
      ${h('√x','fn',"addFn('√(','Math.sqrt(')")}
      ${h('∛x','fn',"addFn('∛(','Math.cbrt(')")}
      ${h('x<sup>2</sup>','fn',"addOp('²','**2')")}
      ${h('x<sup>y</sup>','fn',"addOp('^','**')")}
      ${h('n!','fn',"addFn('fact(','factorial(')")}
    </div>
    <div class="row">
      ${h('⌊x⌋','fn',"addFn('floor(','Math.floor(')")}
      ${h('⌈x⌉','fn',"addFn('ceil(','Math.ceil(')")}
      ${h('|x|','fn',"addFn('|x|(','Math.abs(')")}
      ${h('1/x','fn',"addOp('1÷','1/')")}
      ${h('%','fn',"addOp('%','/100')")}
    </div>
    ${numpad}`;
  } else {
    const consts = [
      {sym:'π',   lbl:'Pi 3.14159…',        m:'Math.PI'},
      {sym:'e',   lbl:'Euler 2.71828…',      m:'Math.E'},
      {sym:'φ',   lbl:'Tỉ lệ vàng',          m:'1.6180339887'},
      {sym:'√2',  lbl:'Căn hai',             m:'Math.SQRT2'},
      {sym:'√3',  lbl:'Căn ba',              m:'Math.sqrt(3)'},
      {sym:'√5',  lbl:'Căn năm',             m:'Math.sqrt(5)'},
      {sym:'g',   lbl:'9.80665 m/s²',        m:'9.80665'},
      {sym:'c',   lbl:'3×10⁸ m/s',           m:'299792458'},
      {sym:'ln2', lbl:'0.69314…',            m:'Math.LN2'},
      {sym:'ln10',lbl:'2.30258…',            m:'Math.LN10'},
      {sym:'γ',   lbl:'Euler–Mascheroni',    m:'0.5772156649'},
      {sym:'1/e', lbl:'0.36787…',            m:'(1/Math.E)'},
    ];
    const rows = [];
    for (let i = 0; i < consts.length; i += 4) {
      const chunk = consts.slice(i, i+4);
      rows.push(`<div class="row">${chunk.map(c =>
        `<button class="k const" onclick="addConst('${c.sym}','${c.m}')">
          <span class="sym">${c.sym}</span>
          <span class="lbl">${c.lbl}</span>
        </button>`).join('')}</div>`);
    }
    el.innerHTML = rows.join('') + numpad;
  }

  // Hàm giai thừa
  if (!window._factInjected) {
    window.factorial = function(n) {
      n = Math.round(n);
      if (n < 0 || n > 170) return NaN;
      if (n <= 1) return 1;
      let r = 1;
      for (let i = 2; i <= n; i++) r *= i;
      return r;
    };
    window._factInjected = true;
  }
}

function setTab(name, el) {
  curTab = name;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderKeys();
}

// ── PHÍM BÀN PHÍM PC ──
document.addEventListener('keydown', e => {
  if (e.ctrlKey||e.metaKey||e.altKey) return;
  if (/^[0-9]$/.test(e.key)) addNum(e.key);
  else if (e.key==='.') addNum('.');
  else if (e.key==='+') addOp('+','+');
  else if (e.key==='-') addOp('−','-');
  else if (e.key==='*') addOp('×','*');
  else if (e.key==='/') { e.preventDefault(); addOp('÷','/'); }
  else if (e.key==='(') addOp('(','(');
  else if (e.key===')') addOp(')','');
  else if (e.key==='Enter'||e.key==='=') calculate();
  else if (e.key==='Backspace') backspace();
  else if (e.key==='Escape') clearAll();
});

renderKeys();
</script>
</body>
</html>
